name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [csharp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect C# projects
        id: detect
        run: |
          if find . -name '*.csproj' -not -path './.git/*' | grep -q .; then
            echo "has_csharp=true" >> "$GITHUB_OUTPUT"
            echo "C# projects found – CodeQL analysis will run."
          else
            echo "has_csharp=false" >> "$GITHUB_OUTPUT"
            echo "No C# projects found – skipping CodeQL analysis for csharp."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Only initialise / build / analyse when there is actual C# code.
      # Running CodeQL csharp analysis on a docs-only repo commonly fails
      # because autobuild has nothing to compile.
      - name: Initialize CodeQL
        if: steps.detect.outputs.has_csharp == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: steps.detect.outputs.has_csharp == 'true'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        if: steps.detect.outputs.has_csharp == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Skip notice
        if: steps.detect.outputs.has_csharp != 'true'
        run: |
          echo "CodeQL csharp analysis skipped – no .csproj files in the repository yet."
          echo "This job is treated as successful. Analysis will start automatically once projects are added."
